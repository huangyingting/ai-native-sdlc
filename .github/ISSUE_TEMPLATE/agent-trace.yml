name: Copilot CLI agent demo
description: Run a traced Copilot CLI orchestration demo and post the result back to this issue.
title: "[Copilot CLI demo] "
labels:
  - agent-trace
body:
  - type: markdown
    attributes:
      value: |
        This form starts a Copilot CLI Agent Demos workflow for repository owners, members, and collaborators. The final result, trace diagnostics, dependency graph, and HTML artifact link are posted as an issue comment.

  - type: dropdown
    id: orchestration_pattern
    attributes:
      label: Orchestration pattern
      description: Select the collaboration pattern to demonstrate in the trace.
      options:
        - Direct execution
        - Parallel delegation
        - Critic-reviser loop
        - Sequential pipeline
      default: 1
    validations:
      required: true

  - type: dropdown
    id: orchestrator_model
    attributes:
      label: Orchestrator model
      description: Delegates work to the subagents and synthesizes the final comparison.
      options:
        - gpt-6-luna
        - gpt-6-sol
        - gpt-6-astra
        - gpt-5.6-luna
        - gpt-5.6-terra
        - gpt-5.6-sol
        - gpt-5.5
        - gpt-5.4
        - gpt-5.4-mini
        - gpt-5.3-codex
        - gpt-5-mini
        - claude-sonnet-5
        - claude-sonnet-4.6
        - gemini-3.8-flash
        - grok-4.7
        - mai-code-1.1-flash
      default: 0
    validations:
      required: true

  - type: dropdown
    id: subagent_model
    attributes:
      label: Subagent model
      description: Shared by dynamically created subagents in the selected pattern.
      options:
        - gpt-6-luna
        - gpt-6-sol
        - gpt-6-astra
        - gpt-5.6-luna
        - gpt-5.6-terra
        - gpt-5.6-sol
        - gpt-5.5
        - gpt-5.4
        - gpt-5.4-mini
        - gpt-5.3-codex
        - gpt-5-mini
        - claude-sonnet-5
        - claude-sonnet-4.6
        - gemini-3.8-flash
        - grok-4.7
        - mai-code-1.1-flash
      default: 0
    validations:
      required: true

  - type: textarea
    id: task_prompt
    attributes:
      label: Task or question
      description: Describe the concrete demo task. Leave empty to use the pattern's example task.
      placeholder: What should Copilot and its dynamic subagents accomplish?

  - type: textarea
    id: agent_instructions
    attributes:
      label: Agent instructions
      description: Optional task-specific guidance for decomposition, specialist perspectives, sources, or handoff behavior.
      placeholder: For example, assign one branch to API compatibility and another to migration risk.

  - type: checkboxes
    id: capture_messages
    attributes:
      label: Trace content
      description: Message payloads may contain sensitive data and will be posted in a downloadable public artifact.
      options:
        - label: Include redacted request and response payloads in the HTML trace artifact
