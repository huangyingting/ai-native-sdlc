name: Copilot CLI call-chain demo

on:
  workflow_dispatch:
    inputs:
      include_messages:
        description: "Include limited request/response excerpts in the public HTML artifact"
        type: boolean
        default: false

permissions:
  contents: read
  copilot-requests: write

jobs:
  trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COPILOT_OTEL_ENABLED: "true"
      COPILOT_OTEL_EXPORTER_TYPE: file
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run parallel read-only analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: "true"
          OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${{ inputs.include_messages && 'true' || 'false' }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/copilot-otel.jsonl
        run: |
          copilot --model gpt-6-luna -p "Use fleet to invoke the repository's aws-storage and azure-storage custom agents concurrently. Compare Amazon S3 and Azure Blob Storage versioning, encryption, lifecycle/access tiers, and access control. The AWS agent must web_fetch official AWS docs; the Azure agent must call Microsoft Learn MCP microsoft_docs_search. Have each cite sources; synthesize a concise comparison noting non-equivalences. Do not edit files or run shell commands." \
            --fleet --allow-tool='read,microsoft-learn(microsoft_docs_search),microsoft-learn(microsoft_docs_fetch)' \
            --allow-url='https://docs.aws.amazon.com' \
            --deny-tool=write --deny-tool=shell
      - name: Render call chain
        if: always()
        env:
          REQUIRE_DEMO_EVIDENCE: "true"
          REQUIRE_MODEL: gpt-6-luna
          TRACE_INCLUDE_MESSAGES: ${{ inputs.include_messages && 'true' || 'false' }}
          TRACE_HTML_PATH: ${{ runner.temp }}/copilot-trace.html
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/copilot-otel.jsonl
        run: node trace-viewer/render-trace.mjs "$COPILOT_OTEL_FILE_EXPORTER_PATH"
      - name: Attach HTML trace viewer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: copilot-trace-viewer
          path: ${{ runner.temp }}/copilot-trace.html
          if-no-files-found: warn
