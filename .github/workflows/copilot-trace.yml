name: Copilot CLI call-chain demo

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPILOT_OTEL_ENABLED: "true"
      COPILOT_OTEL_EXPORTER_TYPE: file
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run parallel read-only analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: "true"
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/copilot-otel.jsonl
        run: |
          copilot -p "Use fleet to launch two subagents concurrently for an Amazon S3 versus Azure Blob Storage comparison. AWS subagent: MUST call built-in web_search to research Amazon S3 versioning, encryption, lifecycle/storage classes, and access control using public AWS documentation. Azure subagent: MUST call the microsoft-learn MCP server's microsoft_docs_search to research Azure Blob Storage versioning, encryption, lifecycle/access tiers, and access control; optionally call microsoft_docs_fetch. Each reports source URLs. After both finish, compare features concisely, noting non-equivalences. Do not edit files or run shell commands." \
            --fleet --allow-tool='read,microsoft-learn(microsoft_docs_search),microsoft-learn(microsoft_docs_fetch)' \
            --deny-tool=write --deny-tool=shell
      - name: Render call chain
        if: always()
        env:
          REQUIRE_DEMO_EVIDENCE: "true"
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/copilot-otel.jsonl
        run: node scripts/render-trace.mjs "$COPILOT_OTEL_FILE_EXPORTER_PATH"
