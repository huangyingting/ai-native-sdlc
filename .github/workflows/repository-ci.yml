name: Repository CI

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/mcp.json"
      - ".github/scripts/**"
      - ".github/workflows/copilot-agent-demos.yml"
      - ".github/workflows/publish-trace-pages.yml"
      - ".github/workflows/repository-ci.yml"
      - "tools/trace-viewer/**"
      - ".node-version"
      - "package.json"
  push:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/mcp.json"
      - ".github/scripts/**"
      - ".github/workflows/copilot-agent-demos.yml"
      - ".github/workflows/publish-trace-pages.yml"
      - ".github/workflows/repository-ci.yml"
      - "tools/trace-viewer/**"
      - ".node-version"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: npm test
