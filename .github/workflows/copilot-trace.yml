name: Copilot CLI call-chain demo

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPILOT_OTEL_ENABLED: "true"
      COPILOT_OTEL_EXPORTER_TYPE: file
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run parallel read-only analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_COPILOT_PROMPT_MODE_WORKSPACE_MCP: "true"
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/copilot-otel.jsonl
        run: |
          copilot -p "Use fleet to launch two subagents concurrently for an Amazon S3 versus Azure Blob Storage comparison. AWS subagent: MUST call built-in web_fetch on these official docs pages: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html, https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html, https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html, and https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-management.html. Azure subagent: MUST call microsoft-learn MCP microsoft_docs_search for Azure Blob Storage versioning, encryption, lifecycle/access tiers, and access control; optionally call microsoft_docs_fetch. Each cites source URLs. After both finish, compare the features concisely and note non-equivalences. Do not edit files or run shell commands." \
            --fleet --allow-tool='read,microsoft-learn(microsoft_docs_search),microsoft-learn(microsoft_docs_fetch)' \
            --allow-url='https://docs.aws.amazon.com' \
            --deny-tool=write --deny-tool=shell
      - name: Render call chain
        if: always()
        env:
          REQUIRE_DEMO_EVIDENCE: "true"
          TRACE_HTML_PATH: ${{ runner.temp }}/copilot-trace.html
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/copilot-otel.jsonl
        run: node scripts/render-trace.mjs "$COPILOT_OTEL_FILE_EXPORTER_PATH"
      - name: Attach HTML trace viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-trace-viewer
          path: ${{ runner.temp }}/copilot-trace.html
          if-no-files-found: warn
