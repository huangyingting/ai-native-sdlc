name: Copilot CLI call-chain demo

on:
  workflow_dispatch:

permissions:
  contents: read
  copilot-requests: write

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COPILOT_OTEL_ENABLED: "true"
      COPILOT_OTEL_EXPORTER_TYPE: file
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Run parallel read-only analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/copilot-otel.jsonl
        run: |
          copilot -p "Use fleet to delegate these two independent read-only tasks concurrently: (1) read this repository's README and use web_search to check current GitHub Actions GITHUB_TOKEN Copilot CLI guidance; (2) read the README and use web_search to check current Copilot CLI OpenTelemetry tracing guidance. Each subagent should report one concrete finding and its public source. Synthesize their findings briefly. Do not edit files or run shell commands." \
            --fleet --allow-tool=read --deny-tool=write --deny-tool=shell
      - name: Render call chain
        if: always()
        env:
          COPILOT_OTEL_FILE_EXPORTER_PATH: ${{ runner.temp }}/copilot-otel.jsonl
        run: node scripts/render-trace.mjs "$COPILOT_OTEL_FILE_EXPORTER_PATH"
