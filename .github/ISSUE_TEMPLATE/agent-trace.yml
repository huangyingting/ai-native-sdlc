name: Agent Trace run
description: Run a traced Copilot comparison and post the result back to this issue.
title: "[Agent Trace] "
labels:
  - agent-trace
body:
  - type: markdown
    attributes:
      value: |
        This form starts the Agent Trace workflow for repository owners, members, and collaborators. The final comparison, trace diagnostics, dependency graph, and HTML artifact link are posted as an issue comment.

  - type: dropdown
    id: orchestration_scenario
    attributes:
      label: Orchestration scenario
      description: Select the collaboration pattern to demonstrate in the trace.
      options:
        - Single agent baseline
        - Concurrent research
        - Review panel
        - Rubber duck critique
        - Lead + specialists
      default: 1
    validations:
      required: true

  - type: dropdown
    id: orchestrator_model
    attributes:
      label: Orchestrator model
      description: Delegates work to the subagents and synthesizes the final comparison.
      options:
        - gpt-6-luna
        - gpt-6-sol
        - gpt-6-astra
        - gpt-5.6-luna
        - gpt-5.6-terra
        - gpt-5.6-sol
        - gpt-5.5
        - gpt-5.4
        - gpt-5.4-mini
        - gpt-5.3-codex
        - gpt-5-mini
        - claude-sonnet-5
        - claude-sonnet-4.6
        - gemini-3.8-flash
        - grok-4.7
        - mai-code-1.1-flash
      default: 0
    validations:
      required: true

  - type: dropdown
    id: subagent_model
    attributes:
      label: Subagent model
      description: Shared by the specialist agents used in the selected scenario.
      options:
        - gpt-6-luna
        - gpt-6-sol
        - gpt-6-astra
        - gpt-5.6-luna
        - gpt-5.6-terra
        - gpt-5.6-sol
        - gpt-5.5
        - gpt-5.4
        - gpt-5.4-mini
        - gpt-5.3-codex
        - gpt-5-mini
        - claude-sonnet-5
        - claude-sonnet-4.6
        - gemini-3.8-flash
        - grok-4.7
        - mai-code-1.1-flash
      default: 0
    validations:
      required: true

  - type: textarea
    id: task_prompt
    attributes:
      label: Task or question
      description: Override the selected scenario's default task.
      placeholder: Leave empty to use the selected scenario's built-in demonstration task.

  - type: checkboxes
    id: capture_messages
    attributes:
      label: Trace content
      description: Message payloads may contain sensitive data and will be posted in a downloadable public artifact.
      options:
        - label: Include redacted request and response payloads in the HTML trace artifact
